<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mistral Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, sans-serif;
    background: #0f172a; color: #e2e8f0;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; background: #1e293b;
    border-bottom: 1px solid #334155;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header button {
    background: #475569; color: white; border: none;
    padding: 8px 14px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg {
    max-width: 85%; padding: 12px 16px;
    border-radius: 12px; line-height: 1.5;
    white-space: pre-wrap; word-wrap: break-word;
    font-size: 15px;
  }
  .user {
    align-self: flex-end; background: #2563eb;
    color: white; border-bottom-right-radius: 4px;
  }
  .assistant {
    align-self: flex-start; background: #1e293b;
    border: 1px solid #334155; border-bottom-left-radius: 4px;
  }
  .error {
    align-self: center; background: #7f1d1d;
    color: #fecaca; font-size: 13px;
    padding: 10px 14px; border-radius: 8px;
  }
  footer {
    padding: 14px 20px; background: #1e293b;
    border-top: 1px solid #334155;
    display: flex; gap: 10px;
  }
  #input {
    flex: 1; padding: 12px 16px;
    background: #0f172a; border: 1px solid #334155;
    border-radius: 8px; color: white;
    font-size: 15px; outline: none;
    font-family: inherit;
  }
  #input:focus { border-color: #2563eb; }
  #send {
    padding: 0 22px; background: #2563eb; color: white;
    border: none; border-radius: 8px;
    cursor: pointer; font-weight: 600; font-size: 15px;
  }
  #send:disabled { background: #475569; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>💬 Mistral Test</h1>
  <button onclick="clearChat()">Xóa</button>
</header>
<div id="chat"></div>
<footer>
  <input id="input" placeholder="Nhập tin nhắn..." autocomplete="off">
  <button id="send">Gửi</button>
</footer>

<script>
// ============ ĐIỀN KEY VÀO ĐÂY ============
const API_KEY = "DÁN_KEY_MISTRAL_CỦA_BẠN";
const MODEL = "mistral-small-latest";
// =========================================

const API_URL = "https://api.mistral.ai/v1/chat/completions";

const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");

let messages = [
  { role: "system", content: "Bạn là trợ lý AI thân thiện, trả lời ngắn gọn bằng tiếng Việt." }
];

function addMessage(role, content) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.textContent = content;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;

  inputEl.value = "";
  addMessage("user", text);
  messages.push({ role: "user", content: text });

  sendBtn.disabled = true;
  sendBtn.textContent = "...";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + API_KEY
      },
      body: JSON.stringify({
        model: MODEL,
        messages: messages
      })
    });

    // Log ra console để dễ debug
    console.log("Status:", res.status);

    if (!res.ok) {
      const errText = await res.text();
      console.error("Error body:", errText);
      throw new Error(`HTTP ${res.status} - ${errText}`);
    }

    const data = await res.json();
    console.log("Response:", data);

    const reply = data.choices?.[0]?.message?.content || "(Không có phản hồi)";
    addMessage("assistant", reply);
    messages.push({ role: "assistant", content: reply });

  } catch (err) {
    console.error("Lỗi chi tiết:", err);
    const errDiv = document.createElement("div");
    errDiv.className = "msg error";
    errDiv.textContent = "❌ " + err.message;
    chatEl.appendChild(errDiv);
    chatEl.scrollTop = chatEl.scrollHeight;
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = "Gửi";
    inputEl.focus();
  }
}

function clearChat() {
  chatEl.innerHTML = "";
  messages = messages.slice(0, 1);
}

sendBtn.addEventListener("click", send);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); send(); }
});
inputEl.focus();
</script>
</body>
</html>
