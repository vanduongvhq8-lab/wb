<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mistral Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header button {
    background: #475569;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  header button:hover { background: #64748b; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .user {
    align-self: flex-end;
    background: #2563eb;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .assistant {
    align-self: flex-start;
    background: #1e293b;
    border: 1px solid #334155;
    border-bottom-left-radius: 4px;
  }
  .assistant.streaming::after {
    content: "▋";
    animation: blink 1s infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  footer {
    padding: 16px 24px;
    background: #1e293b;
    border-top: 1px solid #334155;
    display: flex;
    gap: 12px;
  }
  #input {
    flex: 1;
    padding: 12px 16px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    color: white;
    font-size: 15px;
    outline: none;
    resize: none;
    font-family: inherit;
  }
  #input:focus { border-color: #2563eb; }
  #send {
    padding: 0 24px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 15px;
  }
  #send:disabled { background: #475569; cursor: not-allowed; }
  #send:hover:not(:disabled) { background: #1d4ed8; }
</style>
</head>
<body>
<header>
  <h1>💬 Mistral Chat</h1>
  <button onclick="clearChat()">Xóa hội thoại</button>
</header>
<div id="chat"></div>
<footer>
  <textarea id="input" rows="1" placeholder="Nhập tin nhắn... (Enter để gửi)"></textarea>
  <button id="send">Gửi</button>
</footer>

<script>
// ⚠️ CHỈ DÙNG ĐỂ TEST LOCAL. Không deploy public với key ở đây!
const API_KEY = "DÁN_KEY_MISTRAL_CỦA_BẠN_VÀO_ĐÂY";
const MODEL = "mistral-small-latest";
const API_URL = "https://api.mistral.ai/v1/chat/completions";

const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");

let messages = [
  { role: "system", content: "Bạn là trợ lý AI thân thiện, trả lời bằng tiếng Việt." }
];

function addMessage(role, content = "") {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.textContent = content;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;

  inputEl.value = "";
  inputEl.style.height = "auto";
  addMessage("user", text);
  messages.push({ role: "user", content: text });

  sendBtn.disabled = true;
  const assistantEl = addMessage("assistant", "");
  assistantEl.classList.add("streaming");

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${API_KEY}`
      },
      body: JSON.stringify({
        model: MODEL,
        messages,
        stream: true
      })
    });

    if (!res.ok) {
      const err = await res.text();
      throw new Error(`HTTP ${res.status}: ${err}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullText = "";
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith("data:")) continue;
        const data = trimmed.slice(5).trim();
        if (data === "[DONE]") continue;

        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content;
          if (delta) {
            fullText += delta;
            assistantEl.textContent = fullText;
            chatEl.scrollTop = chatEl.scrollHeight;
          }
        } catch (e) { /* bỏ qua chunk lỗi */ }
      }
    }

    assistantEl.classList.remove("streaming");
    messages.push({ role: "assistant", content: fullText });

  } catch (err) {
    assistantEl.classList.remove("streaming");
    assistantEl.textContent = `❌ Lỗi: ${err.message}`;
    assistantEl.style.color = "#f87171";
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

function clearChat() {
  chatEl.innerHTML = "";
  messages = messages.slice(0, 1);
}

sendBtn.addEventListener("click", send);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + "px";
});
inputEl.focus();
</script>
</body>
</html>
